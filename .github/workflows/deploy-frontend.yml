# Đẩy frontend lên S3 + làm mới CloudFront. Cấu hình secrets theo docs/DEPLOY.md (bước 7).
name: Deploy frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FRONTEND_BUCKET != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Upload
        run: |
          # File có hash trong tên: cache lâu. index.html, sw.js, manifest: không cache.
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude index.html --exclude sw.js --exclude registerSW.js --exclude "workbox-*.js" --exclude manifest.webmanifest
          cd dist
          for f in index.html sw.js registerSW.js manifest.webmanifest workbox-*.js; do
            aws s3 cp "$f" "s3://${{ vars.FRONTEND_BUCKET }}/$f" --cache-control "no-cache"
          done
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/sw.js" "/manifest.webmanifest"
