spring:
  application:
    name: financehealth-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financehealth}
    username: ${DB_USERNAME:financehealth}
    password: ${DB_PASSWORD:financehealth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Danh sách origin được gọi API, cách nhau bởi dấu phẩy
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Ít nhất 32 ký tự. Bắt buộc đổi khi chạy thật.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-hours: ${JWT_TTL_HOURS:720}
  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    # URL công khai của API, dùng để ký link file khi lưu local
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
    s3-bucket: ${S3_BUCKET:}
    s3-region: ${AWS_REGION:ap-southeast-1}
    # Chỉ cần khi dùng Object Storage chuẩn S3 ngoài AWS (BizFly, VNG, FPT, Viettel...)
    s3-endpoint: ${S3_ENDPOINT:}
    s3-access-key: ${S3_ACCESS_KEY:}
    s3-secret-key: ${S3_SECRET_KEY:}
    s3-path-style: ${S3_PATH_STYLE:true}
    signed-url-minutes: 60
  receipt:
    # anthropic hoặc gemini. Thiếu key/project thì tắt quét hóa đơn, người dùng vẫn nhập tay được
    provider: ${RECEIPT_PROVIDER:anthropic}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${RECEIPT_MODEL:claude-opus-5-5}
    gemini:
      # Xác thực bằng file service account trong GOOGLE_APPLICATION_CREDENTIALS
      project: ${GCP_PROJECT_ID:}
      location: ${GCP_LOCATION:global}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
  moments:
    max-video-seconds: 5.5
