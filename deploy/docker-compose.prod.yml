# Chạy trên EC2: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_TYPE: s3
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Tùy chọn tiết kiệm: chạy PostgreSQL ngay trên EC2 thay vì RDS.
  # Bật bằng: docker compose -f docker-compose.prod.yml --profile local-db up -d --build
  # và đặt DB_URL=jdbc:postgresql://db:5432/financehealth trong .env
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: financehealth
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  caddy_data:
  caddy_config:
